[package]
name = "solana-sbpf"
version = "0.11.1"
description = "Virtual machine and JIT compiler for eBPF programs"
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
repository = "https://github.com/anza-xyz/sbpf"
homepage = "https://solana.com/"
keywords = ["BPF", "eBPF", "interpreter", "JIT", "filtering"]
license = "Apache-2.0"
edition = "2018"

include = [
    "src/**",
    "examples/**",
    "tests/**",
    "benches/**",
    "LICENSE*",
    "Cargo.toml",
]

[dependencies]
arbitrary = { version = "1.0", optional = true, features = ["derive"] }
byteorder = { version = "1.2", default-features = false }
combine = { version = "3.8.1", default-features = false }
gdbstub = { version = "0.6.2", optional = true }
hash32 = "0.3.1"
log = { version = "0.4.2", default-features = false }
thiserror = { version = "2.0.9", default-features = false }
rand = { version = "0.8.5", features = ["small_rng"], default-features = false }
rustc-demangle = "0.1"
shuttle = { version = "0.7.1", optional = true }
embedded-io = "0.6"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "memoryapi",
    "sysinfoapi",
    "winnt",
    "errhandlingapi",
], optional = true }

[target.'cfg(not(windows))'.dependencies]
libc = { version = "0.2", optional = true }

[features]
default = []
std = ["byteorder/std", "log/std", "thiserror/std", "combine/std", "rand/std"]
jit = ["libc", "winapi"]
jit-enable-host-stack-frames = ["jit"]
fuzzer-not-safe-for-production = ["arbitrary"]
debugger = ["gdbstub"]
shuttle-test = ["dep:shuttle"]

[dev-dependencies]
elf = "0.0.10"
json = "0.12"
test_utils = { path = "test_utils/" }
